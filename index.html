<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CA$E BATTLE</title>
    <style>
        :root {
            --bg-main: #070a13;
            --bg-panel: #0f1526;
            --accent-blue: #3b82f6;
            --accent-blue-light: #60a5fa;
            --accent-glow: rgba(59, 130, 246, 0.6);
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: #1e2a45;
            --gold: #fbbf24;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top, #111a30 0%, var(--bg-main) 70%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Шапка --- */
        header {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1); background-color: rgba(7, 10, 19, 0.8);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50;
        }
        .logo { font-size: 24px; font-weight: 900; color: var(--accent-blue); letter-spacing: 1px; font-style: italic; text-shadow: 0 0 15px var(--accent-glow); }
        
        .burger-menu {
            display: flex; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; z-index: 60;
        }
        .burger-menu span {
            display: block; width: 30px; height: 3px; background-color: var(--accent-blue);
            border-radius: 2px; transition: 0.3s; box-shadow: 0 0 5px var(--accent-glow);
        }

        /* Боковое меню */
        .side-menu {
            position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: var(--bg-panel);
            z-index: 55; transition: 0.3s; border-left: 1px solid var(--border-color);
            padding: 80px 20px 20px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: -5px 0 30px rgba(0,0,0,0.5);
        }
        .side-menu.open { right: 0; }
        
        .menu-balance {
            font-size: 28px; font-weight: bold; text-align: center; color: var(--gold);
            padding-bottom: 20px; border-bottom: 1px solid var(--border-color);
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.3);
        }
        
        .menu-btn {
            background: rgba(59, 130, 246, 0.1); border: 1px solid var(--accent-blue); color: var(--accent-blue);
            padding: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;
            font-size: 16px; text-transform: uppercase; letter-spacing: 1px;
        }
        .menu-btn:hover { background: var(--accent-blue); color: #fff; box-shadow: 0 0 15px var(--accent-glow); }

        /* --- Сетка кейсов --- */
        .page-content { padding: 30px 20px; max-width: 1000px; margin: 0 auto; }
        .page-title { text-align: center; font-size: 22px; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 2px; }
        
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        @media (min-width: 768px) { .cases-grid { grid-template-columns: repeat(3, 1fr); gap: 30px; } }

        .case-card {
            display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.3s; position: relative;
        }
        .case-card:hover { transform: translateY(-5px) scale(1.02); }
        
        /* Магия для удаления белого фона у картинок */
        .case-card img {
            width: 100%; max-width: 180px; height: 180px; object-fit: contain; margin-bottom: 10px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); z-index: 1;
            mix-blend-mode: multiply; /* Убирает белый фон */
        }
        
        .case-card h3 { font-size: 16px; margin-bottom: 5px; text-transform: uppercase; z-index: 1; text-shadow: 0 2px 5px #000; }
        .case-card .price {
            color: var(--text-main); font-weight: bold; font-size: 15px; background: rgba(15, 21, 38, 0.8);
            padding: 5px 15px; border-radius: 20px; border: 1px solid var(--accent-blue); z-index: 1;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
        }

        /* --- Полноэкранный просмотр кейса --- */
        .fullscreen-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main);
            z-index: 100; display: none; flex-direction: column; align-items: center;
            background-image: radial-gradient(circle at center, #15213b 0%, var(--bg-main) 70%);
            overflow-y: auto;
        }
        .close-fs { position: absolute; top: 20px; left: 20px; font-size: 30px; color: var(--text-muted); cursor: pointer; z-index: 10; }
        .close-fs:hover { color: #fff; }

        .fs-case-container {
            display: flex; flex-direction: column; align-items: center; margin-top: 60px; margin-bottom: 30px;
        }
        .fs-case-img {
            width: 250px; height: 250px; object-fit: contain; filter: drop-shadow(0 0 30px var(--accent-glow));
            transition: transform 0.3s; mix-blend-mode: multiply;
        }
        .fs-case-title { font-size: 28px; margin-top: 15px; text-transform: uppercase; letter-spacing: 2px; }

        /* --- Выбор количества и кнопка --- */
        .controls-area { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 50px; }
        .amount-selector { display: flex; gap: 5px; background: var(--bg-panel); padding: 5px; border-radius: 10px; border: 1px solid var(--border-color); }
        .amount-btn {
            background: none; border: none; color: var(--text-muted); font-size: 16px; font-weight: bold;
            width: 40px; height: 40px; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .amount-btn:hover { color: #fff; }
        .amount-btn.active { background: var(--accent-blue); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }
        
        .open-btn {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #2563eb 100%);
            border: none; color: #fff; padding: 15px 50px; font-size: 18px; font-weight: bold;
            border-radius: 50px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.5); letter-spacing: 1px;
        }
        .open-btn:hover { transform: scale(1.05); box-shadow: 0 5px 30px rgba(59, 130, 246, 0.8); }

        /* --- Рулетка --- */
        .roulette-wrapper {
            width: 100%; max-width: 900px; height: 150px; background: var(--bg-panel);
            border-top: 2px solid var(--accent-blue); border-bottom: 2px solid var(--accent-blue);
            position: relative; overflow: hidden; margin-bottom: 30px; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2) inset;
            display: none;
        }
        .roulette-strip { display: flex; height: 100%; position: absolute; left: 0; }
        .roulette-item {
            width: 130px; height: 100%; flex-shrink: 0; display: flex; justify-content: center; align-items: center;
            border-right: 1px solid var(--border-color); background: #141c2e; padding: 10px;
        }
        .roulette-item img { max-width: 90%; max-height: 90%; object-fit: contain; filter: drop-shadow(0 5px 10px #000); mix-blend-mode: multiply; }
        .roulette-pointer {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 100%;
            background: var(--gold); z-index: 10; box-shadow: 0 0 20px var(--gold), 0 0 40px var(--gold);
        }

        /* --- Модалка пополнения --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 10, 19, 0.9); z-index: 200; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--bg-panel); border: 1px solid var(--accent-blue); padding: 30px; border-radius: 15px;
            width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
        }
        .modal-content h2 { margin-bottom: 20px; font-size: 22px; }
        .modal-content input {
            width: 100%; padding: 15px; background: var(--bg-main); border: 1px solid var(--border-color);
            color: #fff; font-size: 18px; border-radius: 8px; margin-bottom: 20px; outline: none; text-align: center;
        }
        .modal-content input:focus { border-color: var(--accent-blue); }
        .submit-btn {
            width: 100%; padding: 15px; background: var(--accent-blue); border: none; color: #fff;
            font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .submit-btn:hover { background: #2563eb; }

        /* --- Окно выигрыша --- */
        .win-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 300; justify-content: center; align-items: center; flex-direction: column;
        }
        .win-content { text-align: center; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .win-title { font-size: 36px; color: var(--gold); margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        .win-items { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; max-width: 600px; }
        
        .win-item-card {
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.2) 0%, rgba(15, 21, 38, 0.9) 100%);
            border: 2px solid var(--accent-blue); border-radius: 12px; padding: 20px; width: 160px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); position: relative;
        }
        .win-item-card img { width: 100%; height: 100px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px var(--accent-glow)); mix-blend-mode: multiply; }
        .win-item-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .win-item-price { color: var(--gold); font-weight: bold; font-size: 16px; }
        
        .close-win-btn {
            background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 12px 40px;
            font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s;
        }
        .close-win-btn:hover { background: var(--gold); color: #000; box-shadow: 0 0 20px var(--gold); }

        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .confetti { position: absolute; width: 10px; height: 10px; background: var(--gold); animation: fall linear forwards; z-index: 299; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">CA$E BATTLE</div>
        <div class="burger-menu" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <!-- Боковое меню -->
    <div class="side-menu" id="side-menu">
        <div class="menu-balance" id="menu-balance-display">0 ₽</div>
        <button class="menu-btn" onclick="openDepositModal()">💳 Пополнить</button>
        <button class="menu-btn" onclick="alert('Инвентарь в разработке! Все выигрыши автоматически продаются.')">🎒 Инвентарь</button>
    </div>

    <div class="page-content">
        <h1 class="page-title">Серийные кейсы</h1>
        <div class="cases-grid" id="cases-grid"></div>
    </div>

    <!-- Полноэкранный экран кейса -->
    <div class="fullscreen-page" id="fs-page">
        <div class="close-fs" onclick="closeFsPage()">×</div>
        
        <div class="fs-case-container">
            <img id="fs-case-img" class="fs-case-img" src="" alt="Case">
            <h2 id="fs-case-title" class="fs-case-title">Название</h2>
        </div>

        <div class="controls-area" id="fs-controls">
            <div class="amount-selector">
                <button class="amount-btn active" onclick="setAmount(1, event)">1</button>
                <button class="amount-btn" onclick="setAmount(2, event)">2</button>
                <button class="amount-btn" onclick="setAmount(3, event)">3</button>
                <button class="amount-btn" onclick="setAmount(5, event)">5</button>
                <button class="amount-btn" onclick="setAmount(10, event)">10</button>
            </div>
            <button class="open-btn" id="fs-open-btn" onclick="startSpin()">Открыть</button>
        </div>

        <div class="roulette-wrapper" id="roulette-wrapper">
            <div class="roulette-pointer"></div>
            <div class="roulette-strip" id="roulette-strip"></div>
        </div>
    </div>

    <!-- Модалка пополнения -->
    <div class="modal" id="deposit-modal">
        <div class="modal-content">
            <h2>Пополнение баланса</h2>
            <input type="number" id="deposit-amount" placeholder="Введите сумму (1-300)" min="1" max="300">
            <button class="submit-btn" onclick="confirmDeposit()">Пополнить</button>
            <button style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="closeModal('deposit-modal')">Отмена</button>
        </div>
    </div>

    <!-- Окно выигрыша -->
    <div class="win-modal" id="win-modal">
        <div class="win-content">
            <div class="win-title">ПОБЕДА!</div>
            <div class="win-items" id="win-items-container"></div>
            <button class="close-win-btn" onclick="closeWinModal()">Забрать</button>
        </div>
    </div>
        <script>
        const casesData = [
            { id: 1, name: "Начальный", price: 49, img: "https://i.ibb.co/y740rhw/In-Shot-20261017-155827018.jpg" },
            { id: 2, name: "Барахло", price: 129, img: "https://i.ibb.co/MkQfzWB4/In-Shot-20261017-162333547.jpg" },
            { id: 3, name: "Мелочь", price: 249, img: "https://i.ibb.co/nNyPRypn/In-Shot-20261017-162647410.jpg" },
            { id: 4, name: "Стандарт", price: 499, img: "https://i.ibb.co/RTmX1wFT/In-Shot-20261017-163301294.jpg" },
            { id: 5, name: "Черный", price: 999, img: "https://i.ibb.co/V0CGvcnV/In-Shot-20261017-163812675.jpg" },
            { id: 6, name: "Ценный", price: 2299, img: "https://i.ibb.co/MkQfzWB4/In-Shot-20261017-162333547.jpg" } // Заглушка
        ];

        const caseItems = {
            1: [{ name: "Spring Grove", img: "https://i.ibb.co/60TBqPxv/Spring-Grove.webp", price: 19 }]
        };

        let balance = 0;
        let currentCaseId = null;
        let spinAmount = 1;
        let isSpinning = false;
        let wonItemsBuffer = [];

        document.addEventListener('DOMContentLoaded', () => {
            renderCases();
            updateBalance();
        });

        function renderCases() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = '';
            casesData.forEach(c => {
                const card = document.createElement('div');
                card.className = 'case-card';
                card.onclick = () => openCaseFullscreen(c.id);
                card.innerHTML = `
                    <img src="${c.img}" alt="${c.name}">
                    <h3>${c.name}</h3>
                    <div class="price">${c.price} ₽</div>
                `;
                grid.appendChild(card);
            });
        }

        function updateBalance() {
            document.getElementById('menu-balance-display').innerText = balance + ' ₽';
        }

        // --- МЕНЮ ---
        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
        }
        // Закрытие меню при клике мимо
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('side-menu');
            const burger = document.querySelector('.burger-menu');
            if (menu.classList.contains('open') && !menu.contains(e.target) && !burger.contains(e.target)) {
                menu.classList.remove('open');
            }
        });

        // --- ПОПОЛНЕНИЕ ---
        function openDepositModal() {
            document.getElementById('side-menu').classList.remove('open'); // Закрываем меню
            document.getElementById('deposit-modal').style.display = 'flex';
            document.getElementById('deposit-amount').value = '';
        }

        function confirmDeposit() {
            const val = parseInt(document.getElementById('deposit-amount').value);
            if (isNaN(val) || val < 1 || val > 300) {
                alert('Введите сумму от 1 до 300 ₽');
                return;
            }
            balance += val;
            updateBalance();
            closeModal('deposit-modal');
        }

        // --- ЭКРАН КЕЙСА ---
        function openCaseFullscreen(id) {
            if (isSpinning) return;
            const c = casesData.find(x => x.id === id);
            currentCaseId = id;
            
            document.getElementById('fs-case-img').src = c.img;
            document.getElementById('fs-case-title').innerText = c.name;
            document.getElementById('fs-open-btn').innerText = `Открыть за ${c.price} ₽`;
            
            document.getElementById('fs-controls').style.display = 'flex';
            document.getElementById('roulette-wrapper').style.display = 'none';
            document.getElementById('fs-page').style.display = 'flex';
            
            // Сброс выбора на 1
            setAmount(1, { target: document.querySelectorAll('.amount-btn')[0] });
        }

        function closeFsPage() {
            if (isSpinning) return;
            document.getElementById('fs-page').style.display = 'none';
        }

        function setAmount(amount, e) {
            if (isSpinning) return;
            spinAmount = amount;
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('active'));
            if(e && e.target) e.target.classList.add('active');
            
            const c = casesData.find(x => x.id === currentCaseId);
            document.getElementById('fs-open-btn').innerText = `Открыть за ${c.price * spinAmount} ₽`;
        }

        // --- ПРОКРУТКА ---
        function startSpin() {
            if (isSpinning) return;
            const c = casesData.find(x => x.id === currentCaseId);
            const totalCost = c.price * spinAmount;

            if (balance < totalCost) {
                alert("Недостаточно средств! Пополните баланс.");
                return;
            }

            balance -= totalCost;
            updateBalance();

            isSpinning = true;
            wonItemsBuffer = [];
            
            document.getElementById('fs-controls').style.display = 'none';
            document.getElementById('fs-case-img').style.display = 'none';
            document.getElementById('fs-case-title').style.display = 'none';
            
            const wrapper = document.getElementById('roulette-wrapper');
            wrapper.style.display = 'block';

            const strip = document.getElementById('roulette-strip');
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';

            let itemsPool = caseItems[currentCaseId];
            if (!itemsPool || itemsPool.length === 0) {
                itemsPool = [{ name: "Пусто", img: "https://via.placeholder.com/100/141c2e/8b9bb4?text=Empty", price: 0 }];
            }

            const totalItems = 60 + spinAmount;
            for (let i = 0; i < totalItems; i++) {
                const randomItem = itemsPool[Math.floor(Math.random() * itemsPool.length)];
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerHTML = `<img src="${randomItem.img}" alt="item">`;
                strip.appendChild(div);
            }

            const winIndex = 50; 
            for (let i = 0; i < spinAmount; i++) {
                const wonItem = itemsPool[Math.floor(Math.random() * itemsPool.length)];
                wonItemsBuffer.push(wonItem);
                if(i === 0) {
                    strip.children[winIndex].innerHTML = `<img src="${wonItem.img}" alt="item">`;
                }
            }

            const itemWidth = 130;
            const containerWidth = wrapper.offsetWidth;
            const centerOffset = containerWidth / 2;
            const targetX = (winIndex * itemWidth) + (itemWidth / 2) - centerOffset;

            setTimeout(() => {
                strip.style.transition = 'transform 6s cubic-bezier(0.1, 0.9, 0.1, 1)';
                strip.style.transform = `translateX(-${targetX}px)`;
            }, 50);

            setTimeout(() => {
                showWinScreen();
            }, 6200);
        }

        // --- ЭКРАН ВЫИГРЫША ---
        function showWinScreen() {
            const winModal = document.getElementById('win-modal');
            const container = document.getElementById('win-items-container');
            container.innerHTML = '';

            wonItemsBuffer.forEach(item => {
                const card = document.createElement('div');
                card.className = 'win-item-card';
                card.innerHTML = `
                    <img src="${item.img}" alt="${item.name}">
                    <div class="win-item-name">${item.name}</div>
                    <div class="win-item-price">${item.price} ₽</div>
                `;
                container.appendChild(card);
                balance += item.price;
            });
            
            updateBalance();
            winModal.style.display = 'flex';
            createConfetti();

            isSpinning = false;
            document.getElementById('fs-case-img').style.display = 'block';
            document.getElementById('fs-case-title').style.display = 'block';
            document.getElementById('fs-controls').style.display = 'flex';
            document.getElementById('roulette-wrapper').style.display = 'none';
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = Math.random() > 0.5 ? '#fbbf24' : '#3b82f6';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 1 + 's';
                document.getElementById('win-modal').appendChild(confetti);
                setTimeout(() => confetti.remove(), 4000);
            }
        }

        function closeWinModal() {
            document.getElementById('win-modal').style.display = 'none';
            setAmount(1, { target: document.querySelectorAll('.amount-btn')[0] }); 
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }
    </script>
</body>
</html>
